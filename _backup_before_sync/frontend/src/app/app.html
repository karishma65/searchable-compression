<div class="min-h-screen flex flex-col bg-[var(--bg-main)]">
  
  <!-- Navigation Header -->
  <app-navbar></app-navbar>

  <!-- Main View Area -->
  <main class="flex-1 pb-16">
    <app-overview *ngIf="state.activeTab() === 'overview'"></app-overview>
    <app-datasets *ngIf="state.activeTab() === 'datasets'"></app-datasets>
    <app-experiment *ngIf="state.activeTab() === 'experiment'"></app-experiment>
    <app-search *ngIf="state.activeTab() === 'search'"></app-search>

        <span>Frontend: Angular 21 Standalone</span>

      </div>
    </div>
